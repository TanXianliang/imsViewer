[package]
name = "imsviewer"
version = "1.1.0"
description = "IMS Image Viewer"
authors = ["imsViewer"]
edition = "2021"

[lib]
name = "imsviewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
byteorder = "1"
base64 = "0.22"
walkdir = "2"
rayon = "1"
regex = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
sha2 = "0.10"
md5 = "0.7"
crc32fast = "1"
