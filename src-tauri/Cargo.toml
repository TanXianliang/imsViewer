[package]
name = "imsviewer"
version = "1.2.5"
description = "IMS Image Viewer"
authors = ["imsViewer"]
edition = "2021"

[lib]
name = "imsviewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
byteorder = "1"
base64 = "0.22"
avif = { package = "avif-rs", version = "26.7.1" }
walkdir = "2"
rayon = "1"
regex = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
sha2 = "0.10"
md5 = "0.7"
crc32fast = "1"
bye_orb_rs = "0.1.3"
hex = "0.4"
hnsw_rs = "0.3.4"
kamadak-exif = "0.6"
memmap2 = "0.9"
ndarray = "0.17"
num_cpus = "1"
ocrs = "0.12.2"
ort = { version = "2.0.0-rc.12", features = ["directml"] }
rten = "0.24"
rusqlite = { version = "0.40", features = ["bundled"] }
rustdct = "0.7"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
